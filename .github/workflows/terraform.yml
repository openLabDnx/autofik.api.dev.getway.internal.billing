# Validate the Terraform configuration on every PR that touches it.
#
# This workflow deliberately does NOT plan or apply. Applies belong to
# deploy.yml, which runs on a release dispatch with the immutable image tag and
# serialises itself per environment with a concurrency group; a second workflow
# applying on its own schedule would race it for the state lock.
#
# Because nothing here reaches a cluster, `init` runs with -backend=false: the
# kubernetes backend is never contacted, no state is read, and no kubeconfig or
# secret is needed. That also makes the job safe on PRs from forks.
name: Terraform check

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [ master ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  validate:
    name: fmt / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must match deploy.yml. variables.tf uses cross-variable validation,
          # which needs >= 1.9.
          terraform_version: 1.16.2
          terraform_wrapper: false

      # -recursive so a module added under terraform/ is covered too.
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false skips backend initialisation entirely - providers are
      # still downloaded, which is all `validate` needs.
      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

      # envs/<name>.tfvars must declare environment = "<name>". Terraform
      # cannot catch a mismatch on its own: `make tf-apply ENV=prod` derives
      # the state secret_suffix from ENV but the channel rule from the tfvars,
      # so a prod.tfvars saying "stg" would write prod's state while refusing
      # every prod- tag - and the failure would only show up mid-release.
      - name: Environment files are self-consistent
        run: |
          set -euo pipefail
          status=0
          for f in envs/*.tfvars; do
            want="$(basename "$f" .tfvars)"
            got="$(grep -oP '^\s*environment\s*=\s*"\K[^"]+' "$f" || true)"
            if [ "$got" != "$want" ]; then
              echo "::error file=terraform/$f::declares environment = \"${got:-<unset>}\" but the filename says \"$want\""
              status=1
            else
              echo "ok  $f -> $got"
            fi
          done

          for want in dev stg prod; do
            if [ ! -f "envs/$want.tfvars" ]; then
              echo "::error::terraform/envs/$want.tfvars is missing - deploy.yml derives -var-file from the image tag's channel prefix, so every channel needs one"
              status=1
            fi
          done
          exit $status
