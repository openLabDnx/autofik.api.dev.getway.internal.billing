# Internal billing gateway (autofik.dev.api.billing.getway.internal) on the
# RKE2 cluster provisioned by api/ansible.
#
# The pod serves two listeners from one binary:
#   :8081  REST/JSON, transcoded to gRPC by grpc-gateway - this is what the
#          external APISIX gateway proxies /mobile/v1/* to (see apisix/).
#   :50055 gRPC, for other in-cluster services that call BillingGatewayService
#          directly (e.g. the subscription service resolving a caller's
#          identity through VerifyToken).
#
# Neither listener is exposed by an Ingress on purpose: everything from the
# outside must come in through APISIX, which is the only edge for this API.
#
# Apply with `make deploy` (or kubectl apply -k .) - see README.md.
---
# All of this gateway's own objects live here. ArgoCD also has
# CreateNamespace=true, but keeping the Namespace in git means `kubectl
# apply -k .` works on a fresh cluster too.
apiVersion: v1
kind: Namespace
metadata:
  name: billing-gateway
  labels:
    app: billing-getway-internal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-getway-internal
  namespace: billing-gateway
  labels:
    app: billing-getway-internal
data:
  # Listen addresses. Keep these in sync with the container/Service ports
  # below and with the upstream port in apisix/seed-routes.sh.
  GRPC_LISTEN_ADDR: ":50055"
  GATEWAY_LISTEN_ADDR: ":8081"

  # Downstream REST services this gateway proxies to. These are in-cluster
  # Service DNS names - change them to whatever the billing / subscription /
  # user-auth-sso Services are actually called in this namespace, or to an
  # external URL if a service still runs outside the cluster.
  BILLING_SERVICE_URL: "http://billing.default.svc.cluster.local:4041"
  SUBSCRIPTION_SERVICE_URL: "http://subscription.subscription.svc.cluster.local:4040"
  USER_SERVICE_URL: "http://sso.default.svc.cluster.local:4000"

  # GET route on the user service that returns verify-token records. The
  # UserServiceVerifier appends this to USER_SERVICE_URL on every request.
  VERIFY_TOKEN_ENDPOINT: "/api/user/verify-token"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-getway-internal
  namespace: billing-gateway
  labels:
    app: billing-getway-internal
spec:
  # Two replicas spread across the worker nodes: the gateway is stateless (it
  # holds no data, it only proxies), so a second copy costs nothing and keeps
  # the API up through a node reboot or a drain.
  replicas: 2
  selector:
    matchLabels:
      app: billing-getway-internal
  template:
    metadata:
      labels:
        app: billing-getway-internal
    spec:
      # Keep the two replicas off the same node, so losing one node never
      # takes the whole gateway with it. Deliberately `preferred` and not
      # `required`: on a single-node cluster (the local dev one) `required`
      # leaves the second pod Pending for ever and wedges `rollout status`.
      # With three nodes the scheduler separates them anyway.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: billing-getway-internal
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # 65532 = the "nonroot" user baked into the distroless base image the
        # Dockerfile builds on. The binary writes nothing to disk and binds
        # only high ports, so it needs no privileges at all.
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: billing-getway-internal
          # Pushed by the repo's master.yml workflow: dev-v* tags publish
          # :dev-<version> and re-tag it :master. Pin :dev-<version> for a
          # reproducible rollout; :master + Always is the moving dev target.
          image: autofikbyslaap/dev.api.billing.getway:master
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50055
            - name: http-gw
              containerPort: 8081
          envFrom:
            # Publishable API keys for user.auth.sso and the subscription
            # service. Not optional: without them verify-token answers 401 and
            # every request through this gateway fails as "invalid token".
            # secret.yml is gitignored - apply it with `make secret` first.
            - secretRef:
                name: billing-getway-internal
            - configMapRef:
                name: billing-getway-internal
          # /healty (sic - that is the route the binary serves) is mounted
          # ahead of the grpc-gateway mux, so it never enters the gRPC
          # interceptor chain and needs no bearer token.
          startupProbe:
            httpGet:
              path: /healty
              port: http-gw
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healty
              port: http-gw
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healty
              port: http-gw
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-getway-internal
  namespace: billing-gateway
  labels:
    app: billing-getway-internal
spec:
  type: ClusterIP
  selector:
    app: billing-getway-internal
  ports:
    - name: http-gw
      protocol: TCP
      port: 8081
      targetPort: http-gw
    - name: grpc
      protocol: TCP
      port: 50055
      targetPort: grpc
---
# Keeps at least one gateway pod serving while a node is drained (an upgrade,
# a reboot, `kubectl drain`). Without this the scheduler is free to evict both
# replicas at once and the API goes dark for the length of the drain.
#
# minAvailable 1 with replicas 2 means a drain can take one pod and must then
# wait for its replacement to become Ready before taking the other.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: billing-getway-internal
  namespace: billing-gateway
  labels:
    app: billing-getway-internal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: billing-getway-internal
