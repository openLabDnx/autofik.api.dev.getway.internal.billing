# Copy to secret.yml, fill in the two keys, and apply it BEFORE
# billing-getway.yml - the Deployment pulls this Secret in via envFrom, so
# the pod stays in CreateContainerConfigError until it exists.
#
#   cp secret.example.yml secret.yml && $EDITOR secret.yml
#   make secret          # kubectl apply -f secret.yml
#
# secret.yml is gitignored. Neither value is optional in practice:
#
#   USER_SERVICE_PUBLISHABLE_API_KEY
#     Sent as x-publishable-api-key to user.auth.sso's verify-token route.
#     Without it that route answers 401 for every call, which surfaces as
#     "invalid token" on every single request through this gateway.
#
#   SUBSCRIPTION_SERVICE_PUBLISHABLE_API_KEY
#     Sent as x-publishable-api-key to the subscription service, whose
#     requirePublishableKey middleware guards nearly every route. Without it
#     plan/subscription create-list-get calls fail with 400. Use the same key
#     that service's own MEDUSA_PUBLISHABLE_API_KEY holds.
apiVersion: v1
kind: Secret
metadata:
  name: billing-getway-internal
  namespace: default
  labels:
    app: billing-getway-internal
type: Opaque
stringData:
  USER_SERVICE_PUBLISHABLE_API_KEY: ""
  SUBSCRIPTION_SERVICE_PUBLISHABLE_API_KEY: ""
