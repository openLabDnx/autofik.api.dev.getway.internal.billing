# ArgoCD Application for the billing gateway - BOOTSTRAP ONLY.
#
# dev, stg and prod are three separate clusters, each running its own ArgoCD.
# This one file is what you apply in EACH of them to create the Application the
# first time; there is nothing environment-specific in it, because the cluster
# you apply it to is what decides the environment.
#
#   kubectl --kubeconfig=<that cluster> apply -f argocd-application.yaml
#   # or: argocd app create -f argocd-application.yaml
#   # or: paste into the ArgoCD UI (New App -> Edit as YAML)
#
# Applying this deploys whatever `:master` currently points at - a moving tag.
# That is fine for the very first sync and wrong from then on, which is what
# terraform/ exists to fix: it manages this same Application and additionally
# pins `spec.source.kustomize.images` to the released tag and
# `spec.source.kustomize.replicas` to the environment's replica count.
#
# So once Terraform owns an environment, do NOT apply this file to that cluster
# again - it would wipe both pins and ArgoCD would fall back to :master.
#
# Hand each cluster over after its first sync (per environment):
#   export KUBECONFIG=<that cluster's kubeconfig>
#   make tf-init ENV=prod
#   cd terraform && terraform import kubernetes_manifest.billing_gateway_app \
#     "apiVersion=argoproj.io/v1alpha1,kind=Application,namespace=argocd,name=billing-getway-internal"
#
# NOTE: this does NOT create the APISIX routes - those live in that cluster's
# APISIX etcd and are added through the dashboard / Admin API (see the repo
# README and apisix/seed-routes.sh). Do the routes AFTER this syncs.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-getway-internal
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/openLabDnx/autofik.api.dev.getway.internal.billing.git
    targetRevision: master
    # kustomization.yaml lives at the repo root.
    path: .

  destination:
    # The cluster ArgoCD itself runs in. Correct in all three environments,
    # because each has its own ArgoCD. Change only if one of them manages
    # another cluster as a remote/external one under a different name.
    server: https://kubernetes.default.svc
    # The manifests hardcode `namespace: billing-gateway`; keep this in sync.
    namespace: billing-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
