# ArgoCD Application for the master cluster (apisix.master.autofik.com).
#
# This is what makes the billing gateway WORKLOAD (ConfigMap + Deployment +
# Service) run in the master cluster. Apply it once in the master cluster's
# argocd namespace - ArgoCD then syncs the kustomize root of this repo and
# keeps it in sync (prune + selfHeal).
#
#   kubectl apply -f argocd-application.yaml        # needs master kube/ArgoCD access
#   # or: argocd app create -f argocd-application.yaml
#   # or: paste into the ArgoCD UI (New App -> Edit as YAML)
#
# NOTE: this does NOT create the APISIX routes - those live in the master
# APISIX's etcd and are added through the dashboard / Admin API (see the
# repo README and apisix/seed-routes.sh). Do the routes AFTER this syncs.
# BOOTSTRAP ONLY once Terraform is in use. terraform/ manages this same
# Application and additionally pins `spec.source.kustomize.images` to the
# released image tag. Applying this file by hand after that point wipes the
# pin, and ArgoCD falls back to whatever :master happens to be - which is the
# problem the Terraform setup exists to solve.
#
# Use it to create the Application the first time (or on a cluster with no
# Terraform), then hand ownership over:
#   terraform import kubernetes_manifest.billing_gateway_app \
#     "apiVersion=argoproj.io/v1alpha1,kind=Application,namespace=argocd,name=billing-getway-internal"
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-getway-internal
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/openLabDnx/autofik.api.dev.getway.internal.billing.git
    targetRevision: master
    # kustomization.yaml lives at the repo root.
    path: .

  destination:
    # The cluster ArgoCD itself runs in (the master cluster). Change only if
    # ArgoCD manages master as a remote/external cluster under another name.
    server: https://kubernetes.default.svc
    # The manifests hardcode `namespace: billing-gateway`; keep this in sync.
    namespace: billing-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
