# Deploy straight to a cluster with kubectl - no Terraform, no ArgoCD.
#
# For clusters outside the dev/stg/prod release flow in deploy.yml (Terraform
# writes an ArgoCD Application): the local Talos cluster, which has no ArgoCD,
# and nktr-master, which runs one but has no Application for this service.
# This applies the same kustomization `make deploy` does, plus the Secret, and
# waits for the rollout:
#
#   cd ansible
#   ansible-playbook local.yml
#   ansible-playbook local.yml -e target=nktr-master      # over SSH on that node
#   ansible-playbook local.yml -e image_tag=dev-1.2.3     # pin an image
#   ansible-playbook local.yml -e kube_context=other-ctx
#
# or `make ansible-local [TARGET=nktr-master] [IMAGE_TAG=...]` from the repo root.
#
# WHERE IT RUNS: `target` (default localhost) must be in inventory.yml's
# `local` group. On localhost it refuses unless the kubeconfig context is in
# local_contexts, so a shell left pointing at a real cluster cannot be
# deployed to by accident. On a cluster node it runs kubectl ON the node
# against its own RKE2 kubeconfig (host_vars/<node>/), so the host is what
# picks the cluster.
#
# Either way it refuses a cluster where an ArgoCD Application already owns
# the workload - selfHeal would revert this within ~3 minutes.

# The deploy play targets whichever host `target` names, and a name that
# matches no host is silently skipped - so it is checked here first, where a
# bad one fails the run instead.
- name: Check the target
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Require a host from the local group
      ansible.builtin.assert:
        that: target | default('localhost') in groups['local'] | default([])
        fail_msg: >-
          '{{ target | default('localhost') }}' is not in inventory.yml's
          `local` group ({{ groups['local'] | default([]) | join(', ') }}).
          Use deploy.yml for dev/stg/prod.
        quiet: true

- name: Deploy billing-getway with kubectl
  hosts: "{{ target | default('localhost') }}"
  gather_facts: false
  # Cluster nodes set node_become: the RKE2 kubeconfig is root-only.
  become: "{{ node_become | default(false) }}"

  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    app_namespace: billing-gateway
    app_name: billing-getway-internal
    image_repository: autofikbyslaap/dev.api.billing.getway
    # Empty keeps the image in billing-getway.yml (:master, pulled Always).
    image_tag: ""

    # The node_* settings come from host_vars for a host that is a cluster
    # node; play vars would override host_vars, hence the indirection.
    kubectl_bin: "{{ node_kubectl_bin | default('kubectl') }}"
    kubeconfig_path: "{{ node_kubeconfig_path | default(lookup('env', 'KUBECONFIG') or '~/.kube/config') }}"
    # Where `apply -k` reads from. A node gets a copy of the kustomization.
    manifest_dir: "{{ node_manifest_dir | default(repo_root) }}"
    # Empty means the kubeconfig's current-context.
    kube_context: ""
    local_contexts: [admin@talos-default]

    kubectl_args: >-
      {{ ['--kubeconfig', kubeconfig_path | expanduser]
         + (['--context', kube_context] if kube_context else []) }}

  tasks:
    - name: Read the target context and server
      ansible.builtin.command:
        argv: "{{ [kubectl_bin] + kubectl_args + ['config', 'view', '--minify', '-o', item] }}"
      loop:
        - "jsonpath={.contexts[0].name}"
        - "jsonpath={.clusters[0].cluster.server}"
      register: cluster_info
      changed_when: false

    # A node's kubeconfig can only point at its own cluster.
    - name: Refuse a non-local cluster
      when: node_kubeconfig_path is not defined
      ansible.builtin.assert:
        that: cluster_info.results[0].stdout in local_contexts
        fail_msg: >-
          Context '{{ cluster_info.results[0].stdout }}' is not a local cluster
          ({{ local_contexts | join(', ') }}). Use deploy.yml for dev/stg/prod,
          or pass -e '{"local_contexts": ["{{ cluster_info.results[0].stdout }}"]}'.
        quiet: true

    # A cluster without ArgoCD has no such resource type, which is fine; any
    # other error (an unreachable API) fails here.
    - name: Look for an ArgoCD Application named {{ app_name }}
      ansible.builtin.command:
        argv: >-
          {{ [kubectl_bin] + kubectl_args
             + ['get', 'applications.argoproj.io', '-A', '-o', 'name',
                '--field-selector', 'metadata.name=' ~ app_name] }}
      register: argocd_app
      changed_when: false
      failed_when: argocd_app.rc != 0 and 'resource type' not in argocd_app.stderr

    - name: Refuse a cluster where ArgoCD owns the workload
      ansible.builtin.assert:
        that: argocd_app.stdout | length == 0
        fail_msg: >-
          {{ argocd_app.stdout }} manages {{ app_name }} on this cluster, and
          its selfHeal would revert a kubectl deploy. Use deploy.yml.
        quiet: true

    # Tested here, where the file is, even when the deploy runs on a node.
    - name: Fail without secret.yml
      ansible.builtin.assert:
        that: (repo_root ~ '/secret.yml') is file
        fail_msg: "secret.yml not found - cp secret.example.yml secret.yml and fill it in."
        quiet: true

    - name: Show the deploy
      ansible.builtin.debug:
        msg:
          - "host    : {{ inventory_hostname }}"
          - "context : {{ cluster_info.results[0].stdout }}"
          - "cluster : {{ cluster_info.results[1].stdout }}"
          - "image   : {{ (image_repository ~ ':' ~ image_tag) if image_tag else 'as in billing-getway.yml' }}"

    - name: Deploy
      block:
        # The Deployment reads the Secret through envFrom, so the namespace
        # and Secret go first or the pods stick in CreateContainerConfigError.
        - name: Ensure the namespace exists
          ansible.builtin.shell:
            cmd: >-
              {{ ([kubectl_bin] + kubectl_args) | map('quote') | join(' ') }}
              create namespace {{ app_namespace | quote }} --dry-run=client -o yaml
              | {{ ([kubectl_bin] + kubectl_args) | map('quote') | join(' ') }} apply -f -
          register: ns
          changed_when: "'created' in ns.stdout"

        # Over stdin, so the API keys are never written to a node's disk.
        - name: Apply the Secret
          ansible.builtin.command:
            argv: "{{ [kubectl_bin] + kubectl_args + ['apply', '-f', '-'] }}"
            stdin: "{{ lookup('ansible.builtin.file', repo_root ~ '/secret.yml') }}"
          register: secret_apply
          changed_when: "'unchanged' not in secret_apply.stdout"

        # Exactly what kustomization.yaml lists, read from it, so a resource
        # added there is never left behind on the node.
        - name: Create the manifest directory on the node
          when: node_manifest_dir is defined
          ansible.builtin.file:
            path: "{{ manifest_dir }}"
            state: directory
            mode: "0755"

        - name: Copy the kustomization to the node
          when: node_manifest_dir is defined
          ansible.builtin.copy:
            src: "{{ repo_root }}/{{ item }}"
            dest: "{{ manifest_dir }}/{{ item }}"
            mode: "0644"
          loop: >-
            {{ ['kustomization.yaml']
               + (lookup('ansible.builtin.file', repo_root ~ '/kustomization.yaml') | from_yaml).resources }}

        - name: Apply the manifests
          ansible.builtin.command:
            argv: "{{ [kubectl_bin] + kubectl_args + ['apply', '-k', manifest_dir] }}"
          register: manifests
          changed_when: manifests.stdout_lines | reject('search', ' unchanged$') | list | length > 0

        - name: Show what changed
          ansible.builtin.debug:
            msg: "{{ manifests.stdout_lines }}"

        - name: Pin the image to {{ image_tag }}
          when: image_tag | length > 0
          ansible.builtin.command:
            argv: >-
              {{ [kubectl_bin] + kubectl_args
                 + ['-n', app_namespace, 'set', 'image', 'deployment/' ~ app_name,
                    '*=' ~ image_repository ~ ':' ~ image_tag] }}
          register: set_image
          changed_when: set_image.stdout | length > 0

        # With :master nothing in the spec changes between runs, so restart
        # to make imagePullPolicy: Always actually pull the newest build.
        - name: Restart to re-pull the moving tag
          when: image_tag | length == 0 and not (manifests is changed)
          ansible.builtin.command:
            argv: "{{ [kubectl_bin] + kubectl_args + ['-n', app_namespace, 'rollout', 'restart', 'deployment/' ~ app_name] }}"
          changed_when: true

        - name: Wait for the rollout
          ansible.builtin.command:
            argv: >-
              {{ [kubectl_bin] + kubectl_args
                 + ['-n', app_namespace, 'rollout', 'status', 'deployment/' ~ app_name, '--timeout=180s'] }}
          changed_when: false

        - name: Read the pods and service
          ansible.builtin.command:
            argv: "{{ [kubectl_bin] + kubectl_args + ['-n', app_namespace, 'get', 'pods,svc', '-l', 'app=' ~ app_name, '-o', 'wide'] }}"
          register: status
          changed_when: false

        - name: Deployed
          ansible.builtin.debug:
            msg: "{{ status.stdout_lines }}"

      rescue:
        - name: Report what went wrong
          ansible.builtin.shell:
            cmd: |
              k() { {{ ([kubectl_bin] + kubectl_args) | map('quote') | join(' ') }} "$@"; }
              echo "--- pods ---"
              k -n {{ app_namespace | quote }} get pods -o wide
              echo "--- recent events ---"
              k -n {{ app_namespace | quote }} get events --sort-by=.lastTimestamp | tail -20
          register: diagnostics
          changed_when: false
          failed_when: false

        - name: Show diagnostics
          ansible.builtin.debug:
            msg: "{{ diagnostics.stdout_lines + diagnostics.stderr_lines }}"

        - name: Fail the run
          ansible.builtin.fail:
            msg: "Local deploy failed at '{{ ansible_failed_task.name | default('unknown') }}'."
